<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <title>Nutrient management review stages</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b0c0c"/>
    </marker>
  </defs>
  <rect width="640" height="120" fill="#ffffff"/>
  <g fill="#f3f2f1" stroke="#0b0c0c" stroke-width="2">
    <rect x="10" y="30" width="130" height="60"/>
    <rect x="180" y="30" width="130" height="60"/>
    <rect x="350" y="30" width="130" height="60"/>
    <rect x="520" y="30" width="110" height="60"/>
  </g>
  <g stroke="#0b0c0c" stroke-width="2" marker-end="url(#arrow)">
    <line x1="140" y1="60" x2="178" y2="60"/>
    <line x1="310" y1="60" x2="348" y2="60"/>
    <line x1="480" y1="60" x2="518" y2="60"/>
  </g>
  <g fill="#0b0c0c" text-anchor="middle">
    <text x="75" y="56">1. Collect</text><text x="75" y="75">soil data</text>
    <text x="245" y="56">2. Assess</text><text x="245" y="75">nutrient balance</text>
    <text x="415" y="56">3. Set</text><text x="415" y="75">targets</text>
    <text x="575" y="56">4. Review</text><text x="575" y="75">annually</text>
  </g>
</svg>
